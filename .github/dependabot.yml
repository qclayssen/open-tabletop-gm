# Keeps the automation and dependency surfaces current.
#
# Two surfaces exist: the GitHub Actions CI uses, and the display companion's
# requirements files. requirements.txt is the only always-needed package (flask);
# requirements-audio.txt holds the optional heavy pair (numpy, Pillow) and is
# tracked here too, since Dependabot scans the whole directory. The probe tool
# imports only the standard library and ships no manifest, so it needs no entry —
# a directory without a manifest would only make Dependabot error.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /display
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
