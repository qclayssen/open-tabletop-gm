name: tests

on:
  pull_request:
  # push to main is deliberately absent. This check exists to tell you whether a
  # PR is green *before* you push the last commit to it, so it only needs to
  # answer the question on the PR. A push trigger would double the minutes for
  # a result nobody reads.
  merge_group:

permissions:
  contents: read

concurrency:
  # Cancel an in-flight run when the branch moves. Without this, five pushes in a
  # row queue five full suites and the answer that arrives is the answer to the
  # wrong commit -- the same stale-head failure as everything else here.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # One job, one OS, one Python. This is a pre-push signal, not a matrix.
    name: pytest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.13 is the current release. 3.10 is the documented floor and is
          # covered by running the suite locally on whatever the floor is; a
          # matrix here would double the wait for a signal, not add one.
          python-version: '3.13'
      - name: Install test dependencies
        # flask: a dozen tests import display/gm-display-app.py, and
        # tests/test_start.py reads it. flask-cors is NOT needed -- 3c62b92 (#149)
        # dropped the last import of it, so it is not installed here.
        # pyyaml: scripts/graph_extract_deterministic.py sys.exit(2)s at import
        # without it, which crashes pytest's collector with INTERNALERROR
        # rather than a readable failure.
        # playwright: WITHOUT IT 80 DISPLAY TESTS SILENTLY SKIP. That is why it
        # is here -- not for speed. The five *_display_* browser files guard on
        # `HAVE_PLAYWRIGHT` and skip wholesale when the import fails, so a runner
        # without it reported a green run that had checked none of the layout,
        # a11y or XSS work. A skipped suite and a passing suite look identical
        # in a check mark. Chromium is the only browser installed: the display is
        # chromium-rendered and nothing else is claimed to work.
        run: |
          python -m pip install --upgrade pip pytest flask pyyaml playwright pytest-xdist
          python -m playwright install chromium
      - name: pytest
        # -n 4 measured, not guessed. Serial is 603s on this tree; -n 4 is 227s.
        # Two runs of each, and the spread across -n 4 runs was 6s, so the 2.7x
        # is real rather than one lucky run.
        #
        # -n 8 is NOT faster (239s) and is left off deliberately: the suite is
        # dominated by a handful of unsplittable tests, so extra workers only
        # add contention. GitHub's macos-latest has 3 cores, so 4 is already at
        # the edge.
        #
        # xdist safety was checked rather than assumed, because the obvious
        # hazards here are ports and pidfiles. Each worker is a separate
        # process, so os.environ writes cannot cross workers; every
        # make_server binds port 0; the gm-watch tests copy into their own
        # TemporaryDirectory. The process-and-port-heavy files were run under -n
        # 8 five times (test_gm_watch_sh, test_receipts, test_send_dice_wait,
        # test_block_deferral, test_faction_widget, test_display_authorship_queue,
        # test_campaign_lint) with no collision, and the full suite passes under
        # both serial and -n 4 with identical counts.
        run: python -m pytest tests/ -q -n 4