name: tests

on:
  pull_request:
  # push to main is deliberately absent. This check exists to tell you whether a
  # PR is green *before* you push the last commit to it, so it only needs to
  # answer the question on the PR. A push trigger would double the minutes for
  # a result nobody reads.
  #
  # `merge_group` was here and was removed 2026-10-03 (#155). GitHub's own merge
  # queue is not available on this plan -- the API rejects the `merge_queue`
  # ruleset rule with an empty validation error, which is how it says "not in
  # your plan" -- so that trigger can never fire. It read in the workflow file as
  # a rule enforcing a merge-time check and enforced nothing. If the plan ever
  # changes, putting it back is a deliberate edit with a reason attached.

permissions:
  contents: read

concurrency:
  # Cancel an in-flight run when the branch moves. Without this, five pushes in a
  # row queue five full suites and the answer that arrives is the answer to the
  # wrong commit -- the same stale-head failure as everything else here.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # One job, one OS, one Python. This is a pre-push signal, not a matrix.
    name: pytest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.14 is the Python floor (D-14, 2026-10-07): the newest stable
          # release, and the only version this repo tests or supports. There is
          # no older-Python job and no non-UTF-8 locale job any more.
          python-version: '3.14'
      - name: Install test dependencies
        # flask: a dozen tests import display/gm-display-app.py, and
        # tests/test_start.py reads it. flask-cors is NOT needed -- 3c62b92 (#149)
        # dropped the last import of it, so it is not installed here.
        # pyyaml: scripts/graph_extract_deterministic.py sys.exit(2)s at import
        # without it, which crashes pytest's collector with INTERNALERROR
        # rather than a readable failure.
        # playwright: WITHOUT IT 80 DISPLAY TESTS SILENTLY SKIP. That is why it
        # is here -- not for speed. The five *_display_* browser files guard on
        # `HAVE_PLAYWRIGHT` and skip wholesale when the import fails, so a runner
        # without it reported a green run that had checked none of the layout,
        # a11y or XSS work. A skipped suite and a passing suite look identical
        # in a check mark. Chromium is the only browser installed: the display is
        # chromium-rendered and nothing else is claimed to work.
        run: |
          python -m pip install --upgrade pip pytest flask pyyaml playwright pytest-xdist
          python -m playwright install chromium
      - name: Restore the SRD dataset from cache
        # Pinned the same way the two actions above are: full commit SHA, tag in
        # a trailing comment. Dependabot (.github/dependabot.yml) owns the bump,
        # so nothing here re-resolves a tag that could move under a green check.
        #
        # WHY THIS STEP EXISTS: systems/dnd5e/data/dnd5e_srd.json is GENERATED
        # and gitignored (.gitignore:49-51), and nothing in this workflow built
        # it. So on a fresh checkout the dataset was simply absent and ten tests
        # were red for reasons that had nothing to do with the PR. Measured on a
        # clean origin/main worktree with an empty data dir: 8 failed + 2 errors,
        # every one of them environmental. Dropping a locally-built dataset into
        # that same worktree takes it to 4. Those 4 are real and are being fixed
        # on their own account; this step is what stops the other 10 from being
        # noise that buries them.
        #
        # WHY A CACHE AND NOT JUST A BUILD: build_srd.py pulls a couple of
        # hundred files from raw.githubusercontent.com and api.github.com with no
        # token, so it can be refused mid-build on rate limit. Locally that is
        # ~4 minutes for 1527 records / 1652 KB, on every run, on every ref, for
        # a file that is a pure function of the builder. Keying on
        # hashFiles(build_srd.py) means runs 2..N restore rather than refetch,
        # and the dataset under test is the one THIS builder produces instead of
        # whatever upstream served that morning.
        #
        # No restore-keys, deliberately: a prefix fallback would hand back a
        # dataset built by a different builder while reporting the same key,
        # which is precisely the flake this cache exists to remove. Missing
        # cache is handled by the step below, not by a looser key.
        #
        # The cost of a miss is worth stating: the trigger block above has no
        # push-to-main run on purpose, so nothing ever seeds a default-branch
        # copy of this cache, and the FIRST run on any given ref still pays the
        # whole build.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: systems/dnd5e/data/dnd5e_srd.json
          key: srd-dataset-${{ runner.os }}-${{ hashFiles('systems/dnd5e/build_srd.py') }}
      - name: Build the SRD dataset if the cache missed
        # pyyaml is NOT a new dependency here — the install step above already
        # has it — but it is load-bearing FOR THIS STEP in a way worth naming:
        # without it build_srd._build_fvtt() returns early, the build exits 0
        # having written a dataset with zero class features, and the check below
        # is what turns that into a red step rather than a green one.
        #
        # The check runs before the build (so a cache hit costs one JSON parse of
        # a 1.6 MB file) and again after it — so an entry saved by a build that
        # was killed part-way through the write heals on the next run instead of
        # poisoning the key forever. That is not hypothetical: build_srd.py
        # opens the output with "w" and then dumps, so a truncated file is a
        # thing that can actually happen, and a restored cache is trusted
        # blindly by definition.
        #
        # "no empty category" rather than "total_records > 0" is the gate on
        # purpose. build_srd.py only WARNS about a partly-empty dataset: its
        # refusal to write covers the case where EVERY category came back empty,
        # which leaves the likelier case open — one rate-limited repo-tree fetch
        # and the dataset silently loses every class feature while the run stays
        # green. Same rule, applied to the gap the builder left.
        #
        # Nothing in this step reads the dataset for the tests, and no test is
        # skipped, deselected, xfailed or filtered by any of it. pytest below
        # runs exactly as before; it just arrives to find the file its tests
        # were always written to load.
        #
        # GITHUB_TOKEN is here because the first run of this step failed without
        # it, and the log is worth keeping. api.github.com allows 60 req/hour per
        # IP unauthenticated and the hosted runner pool shares an egress IP, so
        # the five raw.githubusercontent.com fetches all succeeded and every
        # api.github.com call came back 403. build_srd exited 0 with features=0
        # and only warned. The gate below caught it -- which is the gate working
        # as intended -- but a red build step is not the goal. Authenticated, the
        # same endpoint allows 5000/hour, and permissions:contents:read is enough
        # for the public metadata being read. build_srd.py reads GITHUB_TOKEN if
        # it is set and builds unchanged when it is not.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          usable() {
            [ -s systems/dnd5e/data/dnd5e_srd.json ] || return 1
            python3 -c "import json,sys; c=json.load(open('systems/dnd5e/data/dnd5e_srd.json'))['_meta']['record_counts']; print('  categories:', ', '.join(f'{k}={v}' for k,v in c.items()) or 'none'); sys.exit(1 if not c or any(not v for v in c.values()) else 0)"
          }
          if usable; then
            echo "  dataset present and complete — no build needed"
          else
            echo "  no complete dataset on disk — building (about 4 minutes)"
            python3 systems/dnd5e/build_srd.py
            usable || { echo "✗ build finished but the dataset is still incomplete" >&2; exit 1; }
          fi
      - name: Hold the dataset to its floors, and the gate itself to a test
        # Strictly ADDITIVE to the two steps above, and weaker in nothing.
        #
        # `usable()` above answers "is any category empty". That catches the
        # features=0 case this workflow was built for. It cannot catch a dataset
        # that is merely SHORT — 180 of 260 features, 100 of 334 monsters — and
        # neither can `build_srd.py`, which warns about a partly-empty dataset
        # and exits 0. `scripts/provision_srd.py` is the stricter gate: recorded
        # per-category floors, an edition check, `_meta` consistency, and the
        # four records the suite reads by name. Same network story underneath
        # (~330 raw.githubusercontent.com calls at 79s measured; ~4 minutes on a
        # cold cache here), so this step costs nothing the step above did not
        # already pay: on a cache hit or a completed build the dataset is on
        # disk, and `--check`-equivalent verification is a JSON read.
        #
        # The second half of this step is the part that matters most. A gate
        # nobody tests is a gate that gets relaxed by whoever is in a hurry, and
        # the check that would notice is not a check. `--selftest` writes 11
        # fixtures to a temp directory and asserts each is rejected BY ITS OWN
        # REASON, because the first version of it only asserted *that* they were
        # rejected — and a mutant that deleted the floor check outright left it
        # green, since the fixture had also tripped the total_records check.
        # Measured: 11/11 mutants caught by the selftest, and 5/5 caught again
        # through tests/test_srd_provisioning.py, because a selftest only its
        # author runs is a comment.
        #
        # The grep is not redundant with the exit code. `--selftest` can print
        # "SELFTEST FAILED" on every fixture and still exit 0 if its own
        # reporting is disabled, so the output is checked as well.
        run: |
          python scripts/provision_srd.py > srd-verify.log 2>&1
          rc=$?
          cat srd-verify.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::the dataset is present but does not meet its floors."
            exit "$rc"
          fi
          # Not redundant with the exit code: it defends against main() being
          # edited to return 0 without verifying, which is the change that would
          # turn this step back into decoration.
          if ! grep -q 'verified -- ' srd-verify.log; then
            echo "::error::provision_srd.py exited 0 without reporting a verified dataset."
            exit 1
          fi
          out=$(python scripts/provision_srd.py --selftest); status=$?
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q 'SELFTEST FAILED'; then
            echo "::error::the provisioning gate reported a failure and may still exit 0"
            exit 1
          fi
          exit $status
      - name: pytest
        # -n 4 measured, not guessed. Serial is 603s on this tree; -n 4 is 227s.
        # Two runs of each, and the spread across -n 4 runs was 6s, so the 2.7x
        # is real rather than one lucky run.
        #
        # -n 8 is NOT faster (239s) and is left off deliberately: the suite is
        # dominated by a handful of unsplittable tests, so extra workers only
        # add contention. GitHub's macos-latest has 3 cores, so 4 is already at
        # the edge.
        #
        # xdist safety was checked rather than assumed, because the obvious
        # hazards here are ports and pidfiles. Each worker is a separate
        # process, so os.environ writes cannot cross workers; every
        # make_server binds port 0; the gm-watch tests copy into their own
        # TemporaryDirectory. The process-and-port-heavy files were run under -n
        # 8 five times (test_gm_watch_sh, test_receipts, test_send_dice_wait,
        # test_block_deferral, test_faction_widget, test_display_authorship_queue,
        # test_campaign_lint) with no collision, and the full suite passes under
        # both serial and -n 4 with identical counts.
        run: python -m pytest tests/ -q -n 4
  eslint:
    # The JavaScript floor, and the first thing in this file that has ever looked at a
    # .js file.
    #
    # WHY IT EXISTS (#219): the pytest job runs one command and cannot read JavaScript, so
    # display/static/display.js (5111 lines, and the entire display) plus atlas.js,
    # tactics.js and mapseditor.js were checked by nothing at all. That is how a
    # ReferenceError for an identifier read out of a scope that does not contain it reached
    # main inside a new 328-line file, twice in one file, with the check reporting green.
    # `no-undef` is a lint-level rule, so that class of defect is a lint-level defect and
    # the class fix is a linter.
    #
    # It is also the cheapest thing in this workflow, measured rather than assumed: the
    # repo's five JavaScript files are 396KB (`git ls-files '*.js' '*.mjs' | xargs wc -c`,
    # which includes the 7KB config itself, so 396KB of code plus config) and one
    # `npx eslint .` pass over all of it is 0.64s-0.95s over three runs. It needs no
    # Python, no Playwright and no browser download.
    #
    # WHY IT CANNOT BLOCK ANYTHING. `continue-on-error` on the job, and a lint step that
    # does not propagate its exit status either. main has no branch protection, no
    # rulesets and no branch rules (checked: the API answers 404 for protection and [] for
    # both of the others), so no check in this file is a required status check, and this
    # job is written so that adding it cannot change that. Lint arrives with three
    # pre-existing findings in files this change does not own; making a first-ever run a
    # gate would red every open PR over dead code in display.js. Report the findings, do
    # not gate merges on them.
    #
    # That is a claim about repo configuration today, not a property of this file, so it
    # is stated where the next person will read it rather than assumed to hold. The moment
    # anyone adds `eslint (advisory)` to a required-checks list, the job becomes a gate
    # and the comment above becomes a lie, and nothing in this repo would notice.
    #
    # A report nobody reads is the thing #219 is actually about, so the step that cannot
    # fail is the one carrying the news: every finding becomes an ::error:: annotation on
    # the PR's changed files, and the per-file counts are appended to this run's job
    # summary instead of only scrolling past in a log. The step after it exists so that
    # this arrangement cannot rot into silence unnoticed.
    #
    # ubuntu-latest: 3x the runners on this plan, and it runs beside the pytest job
    # rather than in front of it.
    name: eslint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24 is the current Node LTS and clears the floor eslint.config.js records as
          # this repo's, so there is one statement of it rather than two that can drift.
          # The eslint version is pinned in package.json too, so a local `npm install`
          # gets the same linter this job runs.
          node-version: '24'
      - name: Install eslint
        # `--no-save`, because package-lock.json is gitignored (.gitignore:89): there is no
        # lockfile to install from and `npm ci` cannot be used in this repo at all. Two
        # consequences worth stating rather than rediscovering. First, the two versions
        # are written out here as well as in package.json and nothing keeps the copies
        # equal: `.github/dependabot.yml` has no `npm` ecosystem entry, so no PR will ever
        # propose a bump and no bot will notice them disagreeing. Second, with no
        # lockfile the transitive tree floats, so a transitive release can break this job
        # with no change to this repo. That is the price of a repo that gitignores its
        # lockfile, paid knowingly rather than by accident.
        #
        # npm resolves the whole manifest even with --no-save, so the two @chartdown
        # dependencies come along too (measured: 80 packages, @chartdown/core and
        # @chartdown/render-svg included). Nothing in this job imports them; they are
        # here because npm installs the tree it is pointed at, not the two packages named
        # on the command line.
        run: npm install --no-save --no-package-lock --no-audit --no-fund eslint@10.12.0 globals@17.13.0
      - name: Lint the display's JavaScript, and report it
        # The report and the log go to RUNNER_TEMP (a mktemp -d when that variable is
        # absent, so the same block runs on a laptop), not into the working tree. Four
        # artefact names in the source tree is four chances for a stray one to be
        # committed by `git add -A`, which .gitignore:9-12 already records as this repo's
        # own version of that mistake. The one file that must be in the tree is the
        # selftest fixture in the step below, because it has to be linted by the real
        # config through the real file glob.
        #
        # Two runs, not one, because ESLint takes one formatter per run: the first is for
        # a human reading the log, the second is JSON for the counts. Two formatter
        # passes over 396KB is still well under two seconds.
        #
        # Both exit statuses are captured rather than propagated, and `|| status=$?` is how
        # a status is captured under this workflow's `bash -e` default: a bare
        # `cmd; status=$?` would exit on the failure and never reach the assignment. The
        # job is already continue-on-error, so propagating them would change nothing about
        # whether a merge is blocked; what it would change is whether the log can say
        # which step found something. The one step in this job that exits non-zero on
        # purpose is the next one, and only when the linter has stopped working.
        run: |
          out_dir="${RUNNER_TEMP:-$(mktemp -d)}"
          lint_status=0
          json_status=0
          npm run --silent lint -- --format stylish > "$out_dir/eslint-stylish.log" 2>&1 || lint_status=$?
          cat "$out_dir/eslint-stylish.log"
          echo "eslint --format stylish exited ${lint_status}"
          npm run --silent lint -- --format json --output-file "$out_dir/eslint-report.json" || json_status=$?
          echo "eslint --format json exited ${json_status}"
          ESLINT_REPORT="$out_dir/eslint-report.json" node --input-type=module <<'JS'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          import { relative } from 'node:path';

          // Everything the reader needs goes to BOTH the log and the job summary, because
          // a job summary is what a reviewer sees without opening anything. Annotations
          // are log-only: they are already rendered on the PR's changed files.
          const summary = process.env.GITHUB_STEP_SUMMARY;
          const note = (line = '') => {
            console.log(line);
            if (summary) appendFileSync(summary, `${line}\n`, 'utf8');
          };
          const annotate = (line) => console.log(line);

          // A missing report means ESLint died rather than found nothing. Those are
          // opposite results that look identical in a log, so say which one this is
          // instead of printing an empty table.
          const report = process.env.ESLINT_REPORT;
          if (!existsSync(report)) {
            note('### eslint (advisory): no report file');
            annotate('::error::eslint wrote no report file, so nothing is known about display/static/*.js');
            note('');
            note('ESLint exited without writing its report. Nothing was checked.');
            process.exit(0);
          }

          const results = JSON.parse(readFileSync(report, 'utf8'));
          const rows = [];
          let total = 0;
          for (const file of results) {
            if (file.messages.length === 0) continue;
            const rel = relative(process.cwd(), file.filePath);
            total += file.messages.length;
            const byRule = {};
            for (const m of file.messages) {
              const rule = m.ruleId ?? 'parse error';
              byRule[rule] = (byRule[rule] ?? 0) + 1;
              annotate(`::error file=${rel},line=${m.line}::${rule}: ${m.message}`);
            }
            const rules = Object.entries(byRule).map(([k, v]) => `${k} x${v}`).join(', ');
            rows.push(`| \`${rel}\` | ${rules} | ${file.messages.length} |`);
          }

          note("### eslint (advisory): the repository's JavaScript");
          note('');
          note(`${results.length} JavaScript file(s) checked.`);
          note('');
          if (results.length === 0) {
            // Zero files checked is not a clean result, it is a linter that looked at
            // nothing, and "no findings" would then be an all-clear about no file at all.
            // The count is printed on every run so this case is visible either way.
            note('Nothing was checked. Every "no findings" in this summary would be a report about no file, so read this as a failure of the job, not of the code.');
            annotate('::error::eslint checked 0 JavaScript files, so no line of this summary is a report about any file');
          } else if (rows.length === 0) {
            note('No findings in any of them.');
          } else {
            note('| file | rules | findings |');
            note('| --- | --- | --- |');
            for (const row of rows) note(row);
            note('');
            note(`**${total} finding(s).** \`no-undef\` is the rule that matters; it is the one that catches an identifier read out of a scope that does not contain it, which is a ReferenceError at the moment that line runs.`);
            note('');
            note("This job is advisory and cannot block a merge. A finding in a file owned by another change is that change's to fix, not this job's.");
          }
          JS
      - name: Prove the lint step can fail
        # The defence the two Python jobs use for their own selftests, for the same
        # reason: a check that cannot fail is decoration, and decoration is the thing
        # #219 is about. The fixture is a real file inside the linted tree, so it goes
        # through the real config and the real `npx eslint` invocation that the step above
        # also uses. The trap removes it in this step and it is never committed.
        #
        # `no-undef` specifically, because that is the rule the fixture has to trip: an
        # identifier in no scope is exactly what reached main in #216, and a linter that
        # has quietly lost the rule is indistinguishable from a linter that passes.
        #
        # `npx eslint "$fixture"` rather than `npm run lint -- "$fixture"`, and that is
        # load-bearing rather than a preference. The lint script is `eslint .`, so npm
        # appends the path instead of replacing it and the command becomes
        # `eslint . <fixture>`: the report then covers all seven files in the tree and
        # this grep would pass if ANY of them reported no-undef, including on a day when
        # the fixture itself reported nothing. Scoping it to the fixture is what makes the
        # count below mean what the step says it means. (Measured: `npm run lint --
        # display/static/atlas.js` reports 6 files, not 1.)
        #
        # The assertion is on a count that is printed first, not on a grep whose result is
        # only used to decide whether to exit. If someone deletes the `if` below, the log
        # still prints `0` and the log is still true; the alternative prints "no-undef
        # reported the fixture" unconditionally, which is decoration that announces it is
        # not decoration.
        run: |
          fixture=display/static/eslint-selftest.js
          out_dir="${RUNNER_TEMP:-$(mktemp -d)}"
          report="$out_dir/eslint-selftest-report.json"
          trap 'rm -f "$fixture" "$report"' EXIT
          cat > "$fixture" <<'FIXTURE'
          'use strict';
          // This name is in no scope, which is the shape of the #216 bug. If no-undef
          // does not report it, the linter is off and this job is decoration.
          const el = document.getElementById('eslint-selftest');
          el.textContent = eslintSelftestUndefined;
          FIXTURE
          npx eslint "$fixture" --format json --output-file "$report" || true
          # No bare `cat` here: if the config itself is broken, ESLint exits 2 and writes
          # no report, and under `bash -e` the step would die on cat's "No such file" with
          # no diagnosis. Name the cause instead.
          if [ ! -s "$report" ]; then
            echo "::error::eslint wrote no report for the fixture, so no-undef was not exercised: the config or the linter itself is broken"
            exit 1
          fi
          cat "$report"
          reported=$(grep -c 'no-undef' "$report" || true)
          echo "selftest: the fixture's report names no-undef ${reported} time(s), and contains 1 file"
          if [ "$reported" -lt 1 ]; then
            echo "::error::eslint did not report the undefined identifier in a fixture written to trip no-undef, so the rule is not armed"
            exit 1
          fi
