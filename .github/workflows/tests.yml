name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu and windows, and the non-UTF-8 locale job this file used to
        # carry, were removed on purpose. They were the only coverage of the
        # encoding bug class, because a UTF-8 default is all a macOS runner
        # ever hands you, so a cp936 or cp1251 console can now regress
        # uncaught. That was accepted knowingly. Reinstating the coverage is a
        # decision to make deliberately, not a gap to fix helpfully.
        os: [macos-latest]
        # a floor and a current release
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        # flask/flask-cors: a dozen tests import display/gm-display-app.py directly.
        # pyyaml: scripts/graph_extract_deterministic.py sys.exit(2)s at import
        # without it, which crashes pytest's collector with INTERNALERROR rather
        # than a readable failure. It is NOT in display/requirements.txt.
        # pygame and numpy ARE in display/requirements.txt but are runtime-only
        # (dice server, TTS) and cost real build time, so they stay out.
        run: python -m pip install --upgrade pip pytest flask flask-cors pyyaml
      - name: pytest
        run: python -m pytest tests/ -q
