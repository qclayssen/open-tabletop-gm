<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ map_name }}</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/atlas.css">
{% if display_mode %}<link rel="stylesheet" href="/static/displays.css">{% endif %}
</head>
<body class="atlas-page{% if display_mode %} atlas-display{% endif %}">
<header class="atlas-header">
  {% if display_mode %}
  <!-- One of the four windows: it links to the launcher, not back to the story,
       because this window is not a page somebody navigated away from. -->
  <a class="atlas-back" href="/displays">Displays</a>
  {% else %}
  <a class="atlas-back" href="/">Back to the story</a>
  {% endif %}
  <h1 id="atlas-title">{{ map_name }}</h1>
</header>
<main class="atlas-main">
  {% if note %}
  <!-- No map behind this window. Said on the page, not as a status code: the
       launcher opens this onto a second screen where nobody is reading logs. -->
  <p class="atlas-note" role="status">{{ note }}</p>
  {% else %}
  <!-- The image and its numbered markers. The markers are aria-hidden: the
       legend beside them is the same information as text, and it is what a
       screen reader or a keyboard reaches. -->
  <div id="atlas-stage" class="atlas-stage">
    <img id="atlas-image" src="{{ image_url }}" alt="{{ map_name }}">
    <div id="atlas-pins" class="atlas-pins" aria-hidden="true"></div>
  </div>
  <nav class="atlas-legend" aria-labelledby="atlas-legend-title">
    <h2 id="atlas-legend-title">Places</h2>
    <ol id="atlas-list"></ol>
    <p id="atlas-empty" class="atlas-empty" hidden>No places are marked on this map yet.</p>
  </nav>
  {% endif %}
</main>
<script id="atlas-data" type="application/json">{{ map_json|safe }}</script>
<script src="/static/atlas.js" defer></script>
{% if display_mode %}<script src="/static/displays.js" defer></script>{% endif %}
</body>
</html>
