<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ map_name }}</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/atlas.css">
</head>
<body class="atlas-page">
<header class="atlas-header">
  <a class="atlas-back" href="/">Back to the story</a>
  <h1 id="atlas-title">{{ map_name }}</h1>
</header>
<main class="atlas-main">
  <!-- The image and its numbered markers. The markers are aria-hidden: the
       legend beside them is the same information as text, and it is what a
       screen reader or a keyboard reaches. -->
  <div id="atlas-stage" class="atlas-stage">
    <img id="atlas-image" src="{{ image_url }}" alt="{{ map_name }}">
    <div id="atlas-pins" class="atlas-pins" aria-hidden="true"></div>
  </div>
  <nav class="atlas-legend" aria-labelledby="atlas-legend-title">
    <h2 id="atlas-legend-title">Places</h2>
    <ol id="atlas-list"></ol>
    <p id="atlas-empty" class="atlas-empty" hidden>No places are marked on this map yet.</p>
  </nav>
</main>
<script id="atlas-data" type="application/json">{{ map_json|safe }}</script>
<script src="/static/atlas.js" defer></script>
</body>
</html>
